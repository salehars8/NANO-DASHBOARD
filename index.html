<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NANO | لوحة التحكم</title><script src="https://cdn.tailwindcss.com"></script><style>body{font-family:Tahoma,Arial,sans-serif}button,input,select,textarea{outline:none}</style></head><body class="bg-slate-950 text-white min-h-screen">
<header class="border-b border-slate-800 bg-slate-950/90 sticky top-0 z-20"><div class="max-w-7xl mx-auto px-4 py-4 flex flex-wrap gap-3 items-center justify-between"><div><b class="text-2xl text-fuchsia-400">ARS / NANO</b><span class="mr-3 text-xs px-2 py-1 rounded bg-slate-800">لوحة حقيقية متصلة بالبوت</span></div><div class="flex gap-2"><button onclick="refresh()" class="px-4 py-2 rounded-lg bg-slate-800 hover:bg-slate-700">تحديث</button><button onclick="logout()" class="px-4 py-2 rounded-lg bg-red-900/40 hover:bg-red-900">خروج</button></div></div></header>
<main class="max-w-7xl mx-auto p-4 md:p-8"><section id="login" class="max-w-md mx-auto mt-16 bg-slate-900 border border-slate-800 rounded-2xl p-6"><h1 class="text-2xl font-bold mb-2">دخول لوحة NANO</h1><p class="text-slate-400 text-sm mb-5">ضع DASHBOARD_TOKEN في Vercel ثم أدخله هنا.</p><input id="token" type="password" placeholder="Dashboard token" class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 mb-3"><button onclick="login()" class="w-full bg-fuchsia-600 hover:bg-fuchsia-500 rounded-xl p-3 font-bold">دخول</button><p id="loginMsg" class="text-red-400 mt-3"></p></section>
<section id="app" class="hidden"><div id="alert" class="hidden mb-5 p-3 rounded-xl bg-slate-900 border border-slate-800"></div><div class="grid grid-cols-2 lg:grid-cols-5 gap-3 mb-6" id="cards"></div><div class="grid lg:grid-cols-3 gap-5"><div class="lg:col-span-2 space-y-5"><div class="bg-slate-900 border border-slate-800 rounded-2xl p-5"><div class="flex justify-between items-center mb-4"><h2 class="font-bold text-lg">تحكم البوت</h2><span id="status" class="text-sm"></span></div><div class="grid sm:grid-cols-2 gap-3"><button onclick="action('pause')" class="p-3 rounded-xl bg-amber-700/40 hover:bg-amber-700">إيقاف الردود مؤقتاً</button><button onclick="action('resume')" class="p-3 rounded-xl bg-emerald-700/40 hover:bg-emerald-700">استئناف</button><button onclick="action('maintenance_on')" class="p-3 rounded-xl bg-red-700/40 hover:bg-red-700">تفعيل الصيانة</button><button onclick="action('maintenance_off')" class="p-3 rounded-xl bg-sky-700/40 hover:bg-sky-700">إيقاف الصيانة</button><button onclick="setModel()" class="p-3 rounded-xl bg-fuchsia-700/40 hover:bg-fuchsia-700">تغيير النموذج</button><button onclick="action('wake')" class="p-3 rounded-xl bg-indigo-700/40 hover:bg-indigo-700">إيقاظ البوت</button></div></div>
<div class="bg-slate-900 border border-slate-800 rounded-2xl p-5"><h2 class="font-bold text-lg mb-4">الردود التلقائية</h2><div class="grid md:grid-cols-3 gap-2"><input id="kw" placeholder="الكلمة" class="bg-slate-950 border border-slate-700 rounded-xl p-3"><input id="reply" placeholder="الرد" class="bg-slate-950 border border-slate-700 rounded-xl p-3"><button onclick="addReply()" class="bg-fuchsia-600 rounded-xl p-3">إضافة</button></div><div id="replies" class="mt-4 space-y-2"></div></div>
<div class="bg-slate-900 border border-slate-800 rounded-2xl p-5"><h2 class="font-bold text-lg mb-4">التذاكر المفتوحة</h2><div id="tickets" class="space-y-2"></div></div></div>
<aside class="space-y-5"><div class="bg-slate-900 border border-slate-800 rounded-2xl p-5"><h2 class="font-bold mb-3">حالة الاتصال</h2><pre id="bot" class="text-xs text-slate-300 whitespace-pre-wrap"></pre></div><div class="bg-slate-900 border border-slate-800 rounded-2xl p-5"><h2 class="font-bold mb-3">آخر العمليات</h2><div id="audits" class="text-sm space-y-2"></div></div></aside></div></section></main>
<script>
let token=localStorage.getItem('nano_token')||'';const $=id=>document.getElementById(id);function headers(){return {'Content-Type':'application/json','Authorization':'Bearer '+token}}async function api(url,opt={}){opt.headers={...headers(),...(opt.headers||{})};let r=await fetch(url,opt);let d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Request failed');return d}function login(){token=$('token').value.trim();if(!token)return;$('loginMsg').textContent='';localStorage.setItem('nano_token',token);refresh()}function logout(){localStorage.removeItem('nano_token');token='';$('app').classList.add('hidden');$('login').classList.remove('hidden')}async function refresh(){if(!token)return;try{let d=await api('/api/dashboard');$('login').classList.add('hidden');$('app').classList.remove('hidden');render(d.data);let a=await api('/api/autoreply');renderReplies(a.data);let t=await api('/api/tickets');renderTickets(t.data)}catch(e){$('loginMsg').textContent=e.message;$('alert').textContent=e.message;$('alert').classList.remove('hidden')}}function render(d){let b=d.bot||{};let s=b.online&&b.lastSeen&&Date.now()-new Date(b.lastSeen).getTime()<45000; $('status').textContent=s?'🟢 متصل':'🔴 غير متصل';$('bot').textContent=JSON.stringify(b,null,2);$('cards').innerHTML=[['الحالة',s?'Online':'Offline'],['المستخدمون',d.users],['تذاكر مفتوحة',d.openTickets],['توزيعات نشطة',d.activeGiveaways],['ردود نشطة',d.activeAutoReplies]].map(x=>`<div class="bg-slate-900 border border-slate-800 rounded-2xl p-4"><div class="text-slate-400 text-xs">${x[0]}</div><b class="text-xl">${x[1]}</b></div>`).join('');$('audits').innerHTML=(d.audits||[]).map(x=>`<div class="border-b border-slate-800 pb-2"><b>${x.action}</b><div class="text-xs text-slate-500">${new Date(x.createdAt).toLocaleString('ar')}</div></div>`).join('')||'لا يوجد'}function renderReplies(a){$('replies').innerHTML=a.map(x=>`<div class="flex justify-between gap-2 bg-slate-950 border border-slate-800 rounded-xl p-3"><span><b>${x.keyword}</b> — ${x.replyMessage}</span><button onclick="delReply('${x._id}')" class="text-red-400">حذف</button></div>`).join('')||'<span class="text-slate-500">لا توجد ردود</span>'}function renderTickets(a){$('tickets').innerHTML=a.map(x=>`<div class="bg-slate-950 border border-slate-800 rounded-xl p-3 flex justify-between gap-2"><span><b>${x.subject}</b><br><small>${x.userId}</small></span><button onclick="closeTicket('${x._id}')" class="text-emerald-400">إغلاق</button></div>`).join('')||'<span class="text-slate-500">لا توجد تذاكر</span>'}async function action(name,payload={}){try{await api('/api/bot/action',{method:'POST',body:JSON.stringify({action:name,payload})});alert('تم إرسال الأمر للبوت؛ سيطبقه خلال ثوانٍ.');refresh()}catch(e){alert(e.message)}}async function setModel(){let m=prompt('اسم نموذج Groq الجديد');if(m)action('set_model',{model:m})}async function addReply(){let keyword=$('kw').value.trim(),replyMessage=$('reply').value.trim();if(!keyword||!replyMessage)return alert('أكمل الحقول');await api('/api/autoreply',{method:'POST',body:JSON.stringify({keyword,replyMessage,userId:'global'})});$('kw').value='';$('reply').value='';refresh()}async function delReply(id){await api('/api/autoreply/'+id,{method:'DELETE'});refresh()}async function closeTicket(id){await api('/api/tickets/close',{method:'POST',body:JSON.stringify({ticketId:id})});refresh()}if(token)refresh();
</script></body></html>
